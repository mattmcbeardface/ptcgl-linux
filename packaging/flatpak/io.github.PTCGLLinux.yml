app-id: io.github.PTCGLLinux
default-branch: stable
collection-id: io.github.PTCGLLinux.Repository

runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk

command: ptcgl-linux
separate-locales: false

x-gl-version: &gl-version '1.4'
x-gl-versions: &gl-versions 25.08;25.08-extra;1.4
x-gl-merge-dirs: &gl-merge-dirs vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d;vdpau

sdk-extensions:
  - org.freedesktop.Sdk.Compat.i386
  - org.freedesktop.Sdk.Extension.toolchain-i386

finish-args:
  - --share=ipc
  - --share=network
  - --own-name=com.steampowered.*
  - --filesystem=xdg-data/umu:create
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --allow=multiarch
  - --allow=devel
  - --allow=per-app-dev-shm
  - --env=XDG_DATA_DIRS=/app/share:/usr/lib/extensions/vulkan/share:/usr/share:/usr/share/runtime/share:/run/host/user-share:/run/host/share:/usr/lib/pressure-vessel/overrides/share

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '25.08'

  org.freedesktop.Platform.Compat.i386.Debug:
    directory: lib/debug/lib/i386-linux-gnu
    version: '25.08'
    no-autodownload: true

  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: *gl-version
    versions: *gl-versions
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: *gl-merge-dirs
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

modules:
  - name: platform-bootstrap
    buildsystem: simple

    build-commands:
      - mkdir -p /app/bin
      - mkdir -p /app/libexec/ptcgl-linux
      - mkdir -p /app/lib/i386-linux-gnu
      - mkdir -p /app/lib/i386-linux-gnu/GL
      - mkdir -p /app/lib/debug/lib/i386-linux-gnu
      - mkdir -p /app/lib/debug/lib/i386-linux-gnu/GL
      - install -Dm644 ld.so.conf /app/etc/ld.so.conf

    sources:
      - type: inline
        dest-filename: ld.so.conf
        contents: |
          include /run/flatpak/ld.so.conf.d/app-*-org.freedesktop.Platform.GL32.*.conf
          /app/lib/i386-linux-gnu
          /lib64

  - name: umu-launcher
    buildsystem: simple

    build-commands:
      - install -Dm755 umu-run /app/libexec/ptcgl-linux/umu-run
      - ln -s ../libexec/ptcgl-linux/umu-run /app/bin/umu-run

    sources:
      - type: archive
        url: https://github.com/Open-Wine-Components/umu-launcher/releases/download/1.4.4/umu-launcher-1.4.4-zipapp.tar
        sha256: eb590691841f7fad3fc3ad8fd5db4ccb87849fe7948e62b28ece7a4ee48cc851

  - name: ptcgl-linux
    buildsystem: simple

    build-commands:
      - python3 -m pip install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 io.github.PTCGLLinux.desktop /app/share/applications/io.github.PTCGLLinux.desktop
      - install -Dm644 io.github.PTCGLLinux.Callback.desktop /app/share/applications/io.github.PTCGLLinux.Callback.desktop
      - install -Dm644 io.github.PTCGLLinux.png /app/share/icons/hicolor/512x512/apps/io.github.PTCGLLinux.png
      - install -Dm644 io.github.PTCGLLinux.metainfo.xml /app/share/metainfo/io.github.PTCGLLinux.metainfo.xml

    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .venv
          - __pycache__
          - '*.pyc'

      - type: file
        path: files/io.github.PTCGLLinux.desktop

      - type: file
        path: files/io.github.PTCGLLinux.Callback.desktop

      - type: file
        path: files/io.github.PTCGLLinux.png

      - type: file
        path: files/io.github.PTCGLLinux.metainfo.xml
